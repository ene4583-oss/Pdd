<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="管理网卖商品，计算单件成本和预估利润">
<title>商品成本台账</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#172538;background:#f5f7fa;--muted:#536276;--border:#dce4ed;--blue:#194ac5;--green:#147450}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}[hidden]{display:none!important}
.wrap{width:min(1160px,calc(100% - 48px));margin:auto}.bar{background:#12213b;color:white}.brand{height:68px;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#2c56c5;font-size:23px}.divider{height:18px;border-left:1px solid #50617c;margin:0 4px}.sub{color:#c9d4e7;font-size:13px;font-weight:400}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:42px 0 25px}h1{margin:0;font-size:34px;letter-spacing:-.04em}p{color:var(--muted);font-size:14px;line-height:1.6;margin:8px 0 0}
button,select,input{border:1px solid #c9d4e2;border-radius:8px;background:white;color:inherit;padding:10px 13px}button{font-weight:650;font-size:14px;white-space:nowrap}button:hover{background:#edf2f8}.primary{background:var(--blue);color:white;border-color:var(--blue);padding:11px 16px}.primary:hover{background:#143ba0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
.card,.panel{background:white;border:1px solid var(--border);border-radius:14px}.card{display:grid;grid-template-columns:42px 1fr;gap:4px 13px;align-items:center;padding:19px;color:var(--muted);font-size:13px}.card strong{color:#172538;font-size:24px;overflow-wrap:anywhere}.stat-icon{width:42px;height:42px;border-radius:11px;background:#eaf0fd;color:#244db9;grid-row:span 2;display:grid;place-items:center;font-size:21px}.card:last-child .stat-icon{background:#e5f5ed;color:var(--green)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px}.toolbar h2,.modal-head h2{font-size:18px;margin:0}.filters{display:flex;gap:8px}.filters input,.filters select{font-size:13px}.scroll{overflow:auto}table{width:100%;min-width:1020px;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:13px;color:#46566c;background:#f2f5fa;font-weight:650}td,th{padding:13px 20px;border-block:1px solid #e6ecf3;white-space:nowrap}td{font-variant-numeric:tabular-nums}.product{display:flex;gap:10px;align-items:center}.product img,.placeholder{width:42px;height:42px;object-fit:cover;border-radius:8px;background:#eaf0fd}.placeholder{display:grid;place-items:center;color:#3458ad}.sku{display:block;color:var(--muted);font-size:12px;margin-top:4px}.product strong{white-space:normal;overflow-wrap:anywhere}.positive{color:var(--green)}.negative,.danger,#error{color:#ac2836}.empty{text-align:center;padding:44px 15px}.empty-icon{width:56px;height:56px;border-radius:15px;background:#eaf0fd;color:var(--blue);display:grid;place-items:center;margin:auto;font-size:28px}.empty h3{margin:14px 0 0}.empty button{margin-top:17px}.list-footer{padding:12px 20px;color:var(--muted);font-size:13px;border-top:1px solid #e6ecf3}.foot{margin:15px 0 25px;font-size:12px}
dialog{width:min(570px,calc(100% - 24px));max-height:calc(100dvh - 24px);border:1px solid var(--border);border-radius:16px;padding:0;color:inherit}dialog::backdrop{background:#12213b99}.modal-head,.modal-foot{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head{border-bottom:1px solid var(--border)}.modal-foot{border-top:1px solid var(--border)}.modal-body{padding:16px 20px}.modal-body h3{font-size:15px;margin:20px 0 10px}.modal-body h3 span{font-size:12px;color:var(--muted)}.fields,.estimate{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields input{display:block;width:100%;margin-top:5px}label,.estimate{font-size:13px;font-weight:600}.photo{display:flex;gap:12px;align-items:center;margin-bottom:14px}.photo img{width:72px;height:72px;border-radius:8px;object-fit:cover}.photo input{display:block;margin-top:5px;max-width:100%;font-size:12px}.estimate{margin-top:16px;padding:13px;background:#edf2fb;border-radius:8px;color:#43536c}.estimate strong{display:block;color:#15243a;margin-top:3px}.actions{display:flex;gap:8px;margin-left:auto}.link,.icon-button{border:0;background:transparent;color:var(--blue)}.link{padding:4px 0}.icon-button{font-size:24px;line-height:1;padding:4px 8px}.danger{border-color:#f0cbd0}#error:empty,#notice:empty{display:none}#notice{color:var(--green)}
@media(max-width:610px){.wrap{width:calc(100% - 28px)}.heading{margin-top:27px;align-items:flex-start}h1{font-size:26px}.stats{gap:7px}.card{display:flex;flex-direction:column;align-items:flex-start;padding:10px;gap:5px}.card strong{font-size:15px}.stat-icon{width:29px;height:29px;font-size:16px}.toolbar{align-items:flex-start;flex-direction:column;padding:14px}.filters{width:100%}.filters input{min-width:0;flex:1}.filters select{max-width:48%;padding-inline:5px}td,th{padding-inline:14px}}

.row-actions{display:flex;gap:6px}#saleFields{margin-top:12px}#stockError{color:#ac2836}
.stats .card:first-child{border-color:#b0c5fa;background:#f1f5ff}
#brandLogo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:white}
#brandName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-nav{display:flex;gap:8px;padding-top:14px}.top-nav button[aria-pressed="true"]{background:#eaf0fd;color:#194ac5;border-color:#bdd0fb}
.company-panel{margin:26px 0;padding:22px;max-width:520px}.company-panel form{display:grid;gap:14px;margin-top:18px}.company-panel input{display:block;width:100%;margin-top:5px}
#companyPreview{width:96px;height:96px;object-fit:contain;border:1px solid var(--border);border-radius:8px}#companyRemove{justify-self:start}
.restock-history{padding-inline-start:22px;max-height:170px;overflow:auto;line-height:1.7;font-size:14px}#restockError{color:#ac2836}
</style>

</head>
<body>
<header class="bar"><div class="wrap brand"><span class="logo" id="brandIcon" aria-hidden="true">▤</span><img id="brandLogo" alt="" hidden><span id="brandName">商品成本台账</span> <span class="divider"></span><span class="sub">网卖管理</span></div></header>
<nav class="wrap top-nav" aria-label="页面导航">
<button id="dashboardTab" type="button" aria-controls="dashboardPanel" aria-pressed="true">总览</button>
<button id="settingsTab" type="button" aria-controls="settingsPanel" aria-pressed="false">设置</button>
</nav>
<main class="wrap">
<div id="dashboardPanel">
<section class="heading"><div><h1>库存与回本总览</h1><p>以下合计涵盖所有已确认进货的商品。</p></div><button class="primary" id="add">＋ 新增商品</button></section>
<section class="stats" aria-label="库存与回本合计">
<div class="card"><span class="stat-icon" aria-hidden="true">◎</span><span>距离整体回本还差</span><strong id="gap">—</strong></div>
<div class="card"><span class="stat-icon" aria-hidden="true">↘</span><span>累计总投入</span><strong id="spent">—</strong></div>
<div class="card"><span class="stat-icon" aria-hidden="true">↗</span><span>扣费后已收回</span><strong id="recovered">—</strong></div>
<div class="card"><span class="stat-icon" aria-hidden="true">▤</span><span>累计进货投入</span><strong id="purchaseSpent">—</strong></div>
<div class="card"><span class="stat-icon" aria-hidden="true">↓</span><span>累计出货费用</span><strong id="shippingSpent">—</strong></div>
<div class="card"><span class="stat-icon" aria-hidden="true">▧</span><span>累计出货件数</span><strong id="shipped">—</strong></div>
</section>
<section class="panel" aria-labelledby="listTitle">
<div class="toolbar"><h2 id="listTitle">商品列表</h2><div class="filters"><input id="search" type="search" placeholder="搜索商品名称或 SKU" aria-label="搜索商品"></div></div>
<div class="scroll"><table><thead><tr><th scope="col">商品</th><th scope="col">售价</th><th scope="col">建议售价</th><th scope="col">单件总成本</th><th scope="col">预估利润</th><th scope="col">利润率</th><th scope="col">出货 / 库存</th><th scope="col">回本状态</th><th scope="col">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" class="empty" hidden><div class="empty-icon" aria-hidden="true">▤</div><h3 id="emptyTitle"></h3><p id="emptyText"></p><button class="primary" id="emptyAdd">＋ 新增商品</button></div>
<div id="listFooter" class="list-footer"></div>
</section>
<p class="foot">商品资料保存在 Google 表格，照片保存在 Google Drive。金额统一使用马币（RM）。</p>
<p id="notice" role="status"></p>
</div>
<section id="settingsPanel" class="panel company-panel" hidden aria-labelledby="companyTitle">
<h1 id="companyTitle">公司设置</h1>
<form id="companyForm">
<label>公司名称<input id="companyName" maxlength="80" placeholder="输入你的公司名称"></label>
<label>公司 Logo<input id="companyLogo" type="file" accept="image/*"></label>
<img id="companyPreview" alt="公司 Logo 预览" hidden>
<button id="companyRemove" type="button" hidden>移除 Logo</button>
<div><button class="primary" id="companySave" type="submit" disabled>保存设置</button></div>
<p id="companyStatus" role="status"></p>
</form>
</section>
</main>
<dialog id="editor" aria-labelledby="editorTitle"><form id="productForm">
<div class="modal-head"><h2 id="editorTitle"></h2><button type="button" id="close" class="icon-button" aria-label="关闭">×</button></div>
<div class="modal-body">
<div class="photo"><img id="photoPreview" alt="商品照片预览" hidden><div><label for="photo">商品照片</label><input id="photo" type="file" accept="image/*"><button id="removePhoto" type="button" class="link" hidden>移除照片</button></div></div>
<div class="fields"><label>商品名称<input name="name" required maxlength="100" placeholder="例如 帆布手提包"></label><label>商品编号 SKU（选填）<input name="sku" maxlength="60" placeholder="例如 BAG-001"></label></div>
<h3>售价与单件费用 <span id="formCurrency"></span></h3>
<div class="fields">
<label>售价（选填）<input name="price" type="number" min="0" max="999999999" step="0.01" placeholder="待定"></label>
<label>进货总金额<input name="purchaseTotal" type="number" min="0" max="999999999" step="0.01" required placeholder="0.00"></label>
<label>进货数量（件）<input name="quantity" type="number" min="1" max="999999999" step="1" required placeholder="例如 50"></label>
<label>包装费<input name="packaging" type="number" min="0" max="999999999" step="0.01" placeholder="0.00"></label>
<label>卖家承担的运费<input name="shipping" type="number" min="0" max="999999999" step="0.01" placeholder="0.00"></label>
<label>平台费率 (%)<input name="rate" type="number" min="0" max="100" step="0.01" placeholder="0"></label>
<label>目标利润率 (%)<input name="target" type="number" min="0" max="100" step="0.01" value="20" required></label>
<label>其他费用<input name="other" type="number" min="0" max="999999999" step="0.01" placeholder="0.00"></label>
</div>
<div class="estimate"><div>每件进货成本 <strong id="unitPurchase"></strong></div><div>建议售价 <strong id="suggested"></strong></div><div>平台费 <strong id="fee"></strong></div><div>单件总成本 <strong id="cost"></strong></div><div>预估利润 <strong id="profit"></strong></div><div>利润率 <strong id="margin"></strong></div></div>
<p id="error" role="alert"></p>
</div>
<div class="modal-foot"><button type="button" id="delete" class="danger">删除商品</button><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="save" type="submit">保存商品</button></div></div>
</form></dialog>
<dialog id="stockEditor" aria-labelledby="stockTitle">
<form id="stockForm">
<div class="modal-head"><h2 id="stockTitle"></h2><button type="button" id="stockClose" class="icon-button" aria-label="关闭">×</button></div>
<div class="modal-body">
<div class="estimate" id="stockSummary"></div>
<p id="stockHint"></p>
<div id="saleFields" class="fields">
<label>本次出货数量（件）<input name="quantity" type="number" min="1" step="1" required></label>
<label><span id="stockRevenueLabel">本次销售收入（RM）</span><input name="revenue" placeholder="填全部出货的收入总额" type="number" min="0" max="999999999" step="0.01" required></label>
<label>本次包装费（RM）<input name="packaging" type="number" min="0" max="999999999" step="0.01" value="0"></label>
</div>
<p id="estimatedSaleCosts" hidden>包装费填本次出货的总额，默认 RM 0。平台费、卖家运费和其他费用按商品设定计算。</p>
<p id="stockError" role="alert"></p>
</div>
<div class="modal-foot"><div class="actions"><button class="primary" id="stockSave" type="submit"></button></div></div>
</form>
</dialog>
<dialog id="restockEditor" aria-labelledby="restockTitle">
<form id="restockForm">
<div class="modal-head"><h2 id="restockTitle"></h2><button type="button" class="icon-button" id="restockClose" aria-label="关闭">×</button></div>
<div class="modal-body">
<div class="fields">
<label>本次补货数量（件）<input name="quantity" type="number" min="1" max="999999999" step="1" required></label>
<label>本次进货总金额（RM）<input name="total" type="number" min="0" max="999999999" step="0.01" required></label>
</div>
<h3>补货记录</h3>
<p id="restockEmpty">还没有补货记录。</p>
<ul id="restockHistory" class="restock-history"></ul>
<p id="restockError" role="alert"></p>
</div>
<div class="modal-foot"><div class="actions"><button class="primary" id="restockSave" type="submit">保存补货</button></div></div>
</form>
</dialog>
<script>
const by = id => document.getElementById(id);
const form = by('productForm');
const editor = by('editor');
const stockEditor = by('stockEditor');
const stockForm = by('stockForm');
let stockProduct;
let stockBusy = false;
const amounts = ['price', 'purchaseTotal', 'packaging', 'shipping', 'rate', 'other', 'target'];
let ready = false, products = [], active, photo, preview, busy = false;
const money = cents => 'RM ' + (cents / 100).toLocaleString('en-MY', {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});
const percentage = value => value == null ? '—' : value.toFixed(1) + '%';

function calculate(p) {
  const fee = p.price == null ? null : Number((BigInt(p.price) * BigInt(p.rate) + 5000n) / 10000n);
  const cost = p.purchase + p.packaging + p.shipping + p.other + (fee ?? 0);
  const profit = p.price == null ? null : p.price - cost;
  const remaining = 10000 - p.rate - p.target;
  const base = p.purchase + p.packaging + p.shipping + p.other;
  const numerator = BigInt(base) * 10000n + (p.rate > 0 ? 5000n : 0n);
  const suggested = remaining > 0 ? Math.max(1, Number((numerator + BigInt(remaining) - 1n) / BigInt(remaining))) : null;
  return { fee, cost, profit, suggested, margin: p.price ? 100 * profit / p.price : null };
}

function rpc(method, ...args) {
  return new Promise((resolve, reject) => {
    const script = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    script[method](...args);
  });
}

const photoCache = new Map();
function loadPhoto(product) {
  const key = product.id + ':' + product.revision;
  if (!photoCache.has(key)) {
    const request = rpc('photoForProduct', product.id).catch(() => {
      photoCache.delete(key);
      return '';
    });
    photoCache.set(key, request);
  }
  return photoCache.get(key);
}

function newProductId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('')
    .replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, '$1-$2-$3-$4-$5');
}

function asDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('无法读取照片。'));
    reader.readAsDataURL(blob);
  });
}

function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value != null) node.textContent = value;
  if (className) node.className = className;
  return node;
}

function summarizeInventory(items) {
  const totals = {batches: 0, purchase: 0, fees: 0, revenue: 0, shipped: 0};
  for (const product of items) {
    if (!product.received) continue;
    totals.batches++;
    totals.purchase += product.purchaseTotal;
    totals.fees += product.sellingCosts;
    totals.revenue += product.revenue;
    totals.shipped += product.sold;
  }
  const spent = totals.purchase + totals.fees;
  const recovered = totals.revenue - totals.fees;
  return {...totals, spent, recovered, gap: Math.max(0, spent - totals.revenue)};
}

function render() {
  const body = by('rows');
  body.replaceChildren();
  const query = by('search').value.trim().toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query));
  for (const p of filtered) {
    const { cost, profit, margin, suggested } = calculate(p);
    const row = body.insertRow();
    const info = element('div', null, 'product');
    if (p.photo) {
      const img = element('img');
      img.alt = '';
      img.loading = 'lazy';
      loadPhoto(p).then(source => { if (source) img.src = source; });
      info.append(img);
    } else {
      const placeholder = element('span', '▧', 'placeholder');
      placeholder.setAttribute('aria-hidden', 'true');
      info.append(placeholder);
    }
    const labels = element('div');
    labels.append(element('strong', p.name));
    if (p.sku) labels.append(element('span', p.sku, 'sku'));
    info.append(labels);
    row.insertCell().append(info);
    row.insertCell().textContent = p.price == null ? '待定' : money(p.price);
    row.insertCell().textContent = suggested == null ? '无法达到' : money(suggested);
    row.insertCell().textContent = money(cost);
    const profitCell = row.insertCell();
    profitCell.textContent = profit == null ? '—' : money(profit);
    profitCell.className = profit < 0 ? 'negative' : profit > 0 ? 'positive' : '';
    row.insertCell().textContent = percentage(margin);
    row.insertCell().textContent = p.received ? p.sold + ' 已出 / ' + (p.quantity - p.sold) + ' 剩余' : '未进货';
    const net = p.revenue - p.sellingCosts;
    row.insertCell().textContent = p.received
      ? (net >= p.purchaseTotal ? '已回本' : '差 ' + money(p.purchaseTotal - net))
      : '—';
    const edit = element('button', '查看 / 编辑');
    edit.setAttribute('aria-label', '查看或编辑 ' + p.name);
    edit.addEventListener('click', () => openEditor(p));
    const stock = element('button', p.received ? (p.sold < p.quantity ? '记录出货' : '查看出货') : '确认进货');
    stock.addEventListener('click', () => openStock(p));
    const actions = element('div', null, 'row-actions');
    actions.append(edit, stock);
    if (p.received) {
      const restock = element('button', '补货');
      restock.addEventListener('click', () => openRestock(p));
      actions.append(restock);
    }
    row.insertCell().append(actions);
  }
  const totals = summarizeInventory(products);
  by('gap').textContent = totals.batches === 0 ? '—' : totals.gap ? money(totals.gap) : '已回本';
  by('spent').textContent = money(totals.spent);
  by('recovered').textContent = money(totals.recovered);
  by('purchaseSpent').textContent = money(totals.purchase);
  by('shippingSpent').textContent = money(totals.fees);
  by('shipped').textContent = totals.shipped.toLocaleString('en-MY') + ' 件';

  by('empty').hidden = filtered.length > 0;
  by('emptyTitle').textContent = products.length ? '找不到符合条件的商品' : '还没有商品';
  by('emptyText').textContent = products.length ? '试试其他商品名称或 SKU。' : '新增第一个商品，就能看到单件成本和利润。';
  by('emptyAdd').hidden = products.length > 0;
  by('listFooter').textContent = query ? `显示 ${filtered.length} 件，共 ${products.length} 件商品` : `共 ${products.length} 件商品`;
}

function readAmounts() {
  const values = Object.fromEntries(amounts.map(key => [key, Math.round((Number(form.elements[key].value) || 0) * 100)]));
  const quantity = Number(form.elements.quantity.value);
  const purchase = quantity > 0 ? Math.round(values.purchaseTotal / quantity) : 0;
  const price = form.elements.price.value === '' ? null : values.price;
  return {...values, price, quantity, purchase};
}

function updateEstimate() {
  const input = readAmounts();
  const validPurchase = form.elements.purchaseTotal.validity.valid && form.elements.quantity.validity.valid;
  by('unitPurchase').textContent = validPurchase ? money(input.purchase) : '—';
  const canSuggest = validPurchase &&
    ['packaging', 'shipping', 'rate', 'other', 'target'].every(key => form.elements[key].validity.valid);
  const recommendation = canSuggest ? calculate({...input, price: 0}).suggested : null;
  by('suggested').textContent = recommendation == null ? (canSuggest ? '费率与目标合计须低于 100%' : '—') : money(recommendation);
  const valid = validPurchase && amounts.every(key => form.elements[key].validity.valid || form.elements[key].validity.valueMissing);
  const values = valid ? calculate(input) : {};
  for (const id of ['fee', 'cost', 'profit']) by(id).textContent = values[id] == null ? '—' : money(values[id]);
  by('margin').textContent = percentage(values.margin);
}

function showPhoto() {
  if (preview?.startsWith('blob:')) URL.revokeObjectURL(preview);
  preview = photo instanceof Blob ? URL.createObjectURL(photo) : '';
  if (preview) by('photoPreview').src = preview;
  else by('photoPreview').removeAttribute('src');
  by('photoPreview').hidden = !preview;
  const item = active;
  if (photo === true && item) loadPhoto(item).then(source => {
    if (!source || !editor.open || active !== item || photo !== true) return;
    by('photoPreview').src = source;
    by('photoPreview').hidden = false;
  });
  by('removePhoto').hidden = !photo;
}

function openEditor(product) {
  if (!ready) return;
  form.reset();
  form.elements.purchaseTotal.readOnly = false;
  form.elements.quantity.readOnly = false;
  active = product;
  photo = product?.photo || null;
  by('error').textContent = '';
  by('notice').textContent = '';
  by('editorTitle').textContent = product ? '编辑商品' : '新增商品';
  by('delete').hidden = !product;
  by('formCurrency').textContent = 'RM';
  if (product) {
    form.elements.name.value = product.name;
    form.elements.sku.value = product.sku;
    form.elements.quantity.value = product.quantity;
    for (const key of amounts) form.elements[key].value = product[key] == null ? '' : product[key] / 100;
    if (product.received) {
      form.elements.purchaseTotal.readOnly = true;
      form.elements.quantity.readOnly = true;
    }
  }
  showPhoto();
  updateEstimate();
  editor.showModal();
  form.elements.name.focus();
}

function setBusy(value) {
  busy = value;
  for (const id of ['save', 'delete', 'close', 'cancel', 'photo', 'removePhoto']) by(id).disabled = value;
}

async function refresh() {
  products = await rpc('listProducts');
  render();
}

const restockEditor = by('restockEditor');
const restockForm = by('restockForm');
let restockProduct;
let restockBusy = false;

function openRestock(product) {
  restockProduct = product;
  restockForm.reset();
  by('restockTitle').textContent = product.name + ' · 补货';
  by('restockError').textContent = '';
  const history = product.restocks || [];
  by('restockEmpty').hidden = history.length > 0;
  by('restockHistory').hidden = history.length === 0;
  const dateFormat = new Intl.DateTimeFormat('zh-MY', {
    timeZone: 'Asia/Kuala_Lumpur', dateStyle: 'medium', timeStyle: 'short'
  });
  by('restockHistory').replaceChildren(...history.slice().reverse().map(entry =>
    element('li', dateFormat.format(new Date(entry.date)) + ' · ' + entry.quantity + ' 件 · ' + money(entry.total))));
  restockEditor.showModal();
}

by('restockClose').onclick = () => restockEditor.close();
restockEditor.addEventListener('cancel', event => { if (restockBusy) event.preventDefault(); });
restockForm.onsubmit = async event => {
  event.preventDefault();
  if (restockBusy) return;
  const {quantity, total} = restockForm.elements;
  const entry = {quantity: Number(quantity.value), total: Math.round(Number(total.value) * 100)};
  restockBusy = true;
  by('restockSave').disabled = by('restockClose').disabled = true;
  by('restockError').textContent = '';
  try {
    const saved = await rpc('recordRestock', restockProduct.id, restockProduct.revision, entry);
    products = products.map(product => product.id === saved.id ? saved : product);
    render();
    restockEditor.close();
    by('notice').textContent = '补货已保存。';
  } catch (error) {
    by('restockError').textContent = error.message || '无法保存补货，请重试。';
  } finally {
    restockBusy = false;
    by('restockSave').disabled = by('restockClose').disabled = false;
  }
};

function openStock(product) {
  stockProduct = product;
  stockForm.reset();
  by('stockError').textContent = '';
  const remaining = product.quantity - product.sold;
  const canShip = product.received && remaining > 0;
  const submit = by('stockSave');
  submit.hidden = product.received && !canShip;
  submit.textContent = product.received ? '保存出货' : '确认已进货';
  by('stockTitle').textContent = product.name + ' · ' + (product.received ? '出货与回本' : '确认进货');
  by('stockHint').textContent = product.received ? '' : '确认后会计入已投入成本，以后可以用「补货」增加库存。';
  by('saleFields').hidden = by('estimatedSaleCosts').hidden = !canShip;
  for (const key of ['quantity', 'revenue', 'packaging']) stockForm.elements[key].disabled = !canShip;
  stockForm.elements.quantity.max = remaining;
  stockForm.elements.revenue.readOnly = product.price != null;
  by('stockRevenueLabel').textContent = product.price == null ? '本次销售收入（RM）' : '自动计算收入（RM）';
  stockForm.elements.revenue.placeholder = product.price == null ? '填扣费前的收入总额' : '售价 × 出货数量';
  const net = product.revenue - product.sellingCosts;
  const items = product.received ? [
    ['已投入进货成本', money(product.purchaseTotal)],
    ['已记销售费用', money(product.sellingCosts)],
    ['累计投入（含销售费用）', money(product.purchaseTotal + product.sellingCosts)],
    ['实际销售收入', money(product.revenue)],
    ['扣费用后收回', money(net)],
    ['累计出货 / 剩余', product.sold + ' 件 / ' + remaining + ' 件'],
    ['回本状态', net >= product.purchaseTotal ? '已回本' : '还差 ' + money(product.purchaseTotal - net)]
  ] : [['本批数量', product.quantity + ' 件'], ['本批进货金额', money(product.purchaseTotal)]];
  by('stockSummary').replaceChildren(...items.map(([label, value]) => {
    const item = element('div', label);
    item.append(element('strong', value));
    return item;
  }));
  stockEditor.showModal();
}

stockForm.elements.quantity.addEventListener('input', () => {
  if (stockProduct.price == null) return;
  const {quantity, revenue} = stockForm.elements;
  revenue.value = quantity.validity.valid ? (stockProduct.price * Number(quantity.value) / 100).toFixed(2) : '';
});

by('stockClose').onclick = () => stockEditor.close();
stockEditor.addEventListener('cancel', event => { if (stockBusy) event.preventDefault(); });
stockForm.onsubmit = async event => {
  event.preventDefault();
  if (stockBusy) return;
  const fields = stockForm.elements;
  const sale = stockProduct.received ? {
    quantity: Number(fields.quantity.value),
    revenue: stockProduct.price == null ? Math.round(Number(fields.revenue.value) * 100) : null,
    packaging: Math.round(Number(fields.packaging.value) * 100)
  } : null;
  stockBusy = true;
  by('stockSave').disabled = by('stockClose').disabled = true;
  by('stockError').textContent = '';
  try {
    const saved = await rpc('recordInventory', stockProduct.id, stockProduct.revision, sale);
    products = products.map(product => product.id === saved.id ? saved : product);
    render();
    stockEditor.close();
    by('notice').textContent = sale ? '出货已保存。' : '已确认进货。';
  } catch (error) {
    by('stockError').textContent = error.message || '无法保存，请重试。';
  } finally {
    stockBusy = false;
    by('stockSave').disabled = by('stockClose').disabled = false;
  }
};

by('add').onclick = by('emptyAdd').onclick = () => openEditor();
by('search').oninput = render;
by('close').onclick = by('cancel').onclick = () => editor.close();
editor.addEventListener('cancel', event => { if (busy) event.preventDefault(); });
editor.addEventListener('close', () => {
  photo = null;
  showPhoto();
});
form.addEventListener('input', updateEstimate);
async function resizeImage(file, maxSide) {
  if (!file.type.startsWith('image/') || file.size > 20 * 1024 * 1024) throw new Error();
  const bitmap = await createImageBitmap(file);
  try {
    const ratio = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * ratio));
    canvas.height = Math.max(1, Math.round(bitmap.height * ratio));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const resized = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', .85));
    if (!resized) throw new Error();
    return resized;
  } finally {
    bitmap.close();
  }
}

let pendingLogo = '';
let removeCompanyLogo = false;
let companyBusy = false;

function showCompanyLogo(source) {
  const image = by('companyPreview');
  image.hidden = !source;
  by('companyRemove').hidden = !source;
  if (source) image.src = source;
  else image.removeAttribute('src');
}

function applyCompany(settings) {
  by('brandName').textContent = settings.name || '商品成本台账';
  by('brandLogo').hidden = !settings.logo;
  by('brandIcon').hidden = Boolean(settings.logo);
  if (settings.logo) by('brandLogo').src = settings.logo;
  else by('brandLogo').removeAttribute('src');
}

function setCompanyBusy(value) {
  companyBusy = value;
  for (const id of ['companyName', 'companyLogo', 'companyRemove', 'companySave']) by(id).disabled = value;
}

function showSettings(open) {
  by('dashboardPanel').hidden = open;
  by('settingsPanel').hidden = !open;
  by('dashboardTab').setAttribute('aria-pressed', String(!open));
  by('settingsTab').setAttribute('aria-pressed', String(open));
  if (!open || companyBusy) return;
  setCompanyBusy(true);
  by('companyStatus').textContent = '';
  rpc('getCompanySettings').then(settings => {
    applyCompany(settings);
    by('companyForm').reset();
    by('companyName').value = settings.name;
    pendingLogo = '';
    removeCompanyLogo = false;
    showCompanyLogo(settings.logo);
  }).catch(error => {
    by('companyStatus').textContent = error.message || '无法读取公司设置。';
  }).finally(() => setCompanyBusy(false));
}

by('dashboardTab').onclick = () => showSettings(false);
by('settingsTab').onclick = () => {
  if (by('settingsPanel').hidden) showSettings(true);
};
by('companyLogo').onchange = async () => {
  const file = by('companyLogo').files[0];
  if (!file || companyBusy) return;
  setCompanyBusy(true);
  by('companyStatus').textContent = '';
  try {
    pendingLogo = await asDataUrl(await resizeImage(file, 320));
    removeCompanyLogo = false;
    showCompanyLogo(pendingLogo);
  } catch {
    by('companyLogo').value = '';
    by('companyStatus').textContent = '无法读取 Logo，请选择小于 20 MB 的图片。';
  } finally {
    setCompanyBusy(false);
  }
};
by('companyRemove').onclick = () => {
  pendingLogo = '';
  removeCompanyLogo = true;
  by('companyLogo').value = '';
  showCompanyLogo('');
};
by('companyForm').onsubmit = async event => {
  event.preventDefault();
  if (companyBusy) return;
  setCompanyBusy(true);
  by('companyStatus').textContent = '';
  try {
    const saved = await rpc('saveCompanySettings', by('companyName').value, pendingLogo, removeCompanyLogo);
    applyCompany(saved);
    by('companyName').value = saved.name;
    by('companyLogo').value = '';
    pendingLogo = '';
    removeCompanyLogo = false;
    showCompanyLogo(saved.logo);
    by('companyStatus').textContent = '公司设置已保存。';
  } catch (error) {
    by('companyStatus').textContent = error.message || '无法保存设置。';
  } finally {
    setCompanyBusy(false);
  }
};
rpc('getCompanySettings').then(applyCompany).catch(() => {});

by('photo').onchange = async () => {
  const file = by('photo').files[0];
  if (!file) return;
  by('error').textContent = '';
  setBusy(true);
  try {
    photo = await resizeImage(file, 900);
    showPhoto();
  } catch {
    by('photo').value = '';
    by('error').textContent = '无法读取照片。请选择可打开且小于 20 MB 的图片。';
  } finally {
    setBusy(false);
  }
};
by('removePhoto').onclick = () => {
  if (busy) return;
  photo = null;
  by('photo').value = '';
  showPhoto();
};
form.onsubmit = async event => {
  event.preventDefault();
  if (busy) return;
  const name = form.elements.name.value.trim();
  if (!name) {
    by('error').textContent = '请输入商品名称。';
    form.elements.name.focus();
    return;
  }
  const product = {
    id: active?.id || newProductId(), name, sku: form.elements.sku.value.trim(),
    ...readAmounts(), revision: active?.revision, keepPhoto: photo === true
  };
  setBusy(true);
  try {
    const photoData = photo instanceof Blob ? await asDataUrl(photo) : '';
    const saved = await rpc('saveProduct', product, photoData);
    products = [saved, ...products.filter(item => item.id !== saved.id)];
    render();
    editor.close();
    by('notice').textContent = '商品已保存。';
  } catch (error) {
    by('error').textContent = error.message || '无法保存商品，请重试。';
  } finally {
    setBusy(false);
  }
};
by('delete').onclick = async () => {
  if (busy || !active || !confirm('确定删除这件商品和照片？')) return;
  setBusy(true);
  try {
    await rpc('deleteProduct', active.id, active.revision);
    products = products.filter(item => item.id !== active.id);
    render();
    editor.close();
    by('notice').textContent = '商品已删除。';
  } catch {
    by('error').textContent = '无法删除商品，请重试。';
  } finally {
    setBusy(false);
  }
};

by('add').disabled = by('emptyAdd').disabled = true;
refresh().then(() => {
  ready = true;
  by('add').disabled = by('emptyAdd').disabled = false;
}).catch(error => {
  by('notice').textContent = error.message || '无法读取商品资料。请重新打开页面。';
});
window.addEventListener('focus', () => {
  if (ready && !editor.open && !stockEditor.open && !restockEditor.open && !busy) refresh().catch(() => {});
});

</script>
</body>
</html>
